version: '3.9'

services:
  # SQL Server (local development only)
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "LocktonOrion_Dev1!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P LocktonOrion_Dev1! -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Azure Service Bus Emulator (Dapr-based emulator for local dev)
  # Replace with real Azure Service Bus connection string in production
  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    environment:
      ACCEPT_LICENSE: "true"
      SQL_SERVER: "sqlserver"
      MSSQL_SA_PASSWORD: "LocktonOrion_Dev1!"
    ports:
      - "5672:5672"
      - "5300:5300"
    depends_on:
      sqlserver:
        condition: service_healthy

  # .NET API
  api:
    build:
      context: .
      dockerfile: src/LocktonOrion.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=LocktonOrion;User=sa;Password=LocktonOrion_Dev1!;TrustServerCertificate=true"
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  # React Frontend (dev server)
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://api:8080/api/v1

volumes:
  sqlserver_data:
