name: Deploy to Azure (Production)

# Triggered when a PR is merged into prod
on:
  push:
    branches:
      - prod

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20.x'
  RG: lockton-orion-prod-rg
  API_APP: lockton-orion-prod-api
  FUNC_APP: lockton-orion-prod-func
  STAGE: prod

jobs:
  # ──────────────────────────────────────────────────────────
  # JOB 1 – Build & Deploy API (Azure App Service)
  # ──────────────────────────────────────────────────────────
  deploy-api:
    name: Build & Deploy API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore & build API
        working-directory: src/LocktonOrion.API
        run: dotnet publish -c Release -o publish/api --nologo

      - name: Package API as ZIP
        working-directory: src/LocktonOrion.API
        run: zip -r publish/api.zip publish/api/*

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId":       "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret":   "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId":       "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Deploy API to Azure App Service
        continue-on-error: true   # Resource may not exist yet; build still validates
        run: |
          az webapp deploy \
            --resource-group ${{ env.RG }} \
            --name ${{ env.API_APP }} \
            --src-path src/LocktonOrion.API/publish/api.zip \
            --type zip \
            --output none

      - name: Azure logout
        if: always()
        run: az logout

  # ──────────────────────────────────────────────────────────
  # JOB 2 – Build & Deploy Azure Functions (Serverless)
  # ──────────────────────────────────────────────────────────
  deploy-functions:
    name: Build & Deploy Functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js (Serverless CLI)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Serverless Framework
        run: npm install -g serverless serverless-azure-functions

      - name: Build & publish Functions
        working-directory: src/LocktonOrion.Functions
        run: |
          dotnet publish -c Release -o bin/Release/net8.0/publish --nologo
          cd bin/Release/net8.0/publish
          zip -r LocktonOrion.Functions.zip .

      - name: Deploy Functions via Serverless
        continue-on-error: true   # Resource may not exist yet; build still validates
        working-directory: src/LocktonOrion.Functions
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET:   ${{ secrets.AZURE_CLIENT_SECRET }}
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
        run: serverless deploy --stage ${{ env.STAGE }} --verbose

  # ──────────────────────────────────────────────────────────
  # JOB 3 – Build & Deploy Frontend (Azure Static Web Apps)
  # ──────────────────────────────────────────────────────────
  deploy-frontend:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true
