service: lockton-orion-functions

frameworkVersion: '4'

provider:
  name: azure
  region: East US
  runtime: dotnet-isolated8
  os: windows

  prefix: lockton-orion
  resourceGroup: lockton-orion-${opt:stage, 'dev'}-rg

  subscriptionId: ${env:AZURE_SUBSCRIPTION_ID}
  tenantId: ${env:AZURE_TENANT_ID}
  appId: ${env:AZURE_CLIENT_ID}
  appSecret: ${env:AZURE_CLIENT_SECRET}

  storageAccount:
    name: locktonorion${opt:stage, 'dev'}stor

  appServicePlan:
    name: lockton-orion-${opt:stage, 'dev'}-asp
    kind: functionapp
    sku:
      name: Y1
      tier: Dynamic

  functionApp:
    name: lockton-orion-${opt:stage, 'dev'}-func
    appSettings:
      FUNCTIONS_WORKER_RUNTIME: dotnet-isolated
      FUNCTIONS_EXTENSION_VERSION: '~4'
      ASPNETCORE_ENVIRONMENT: ${opt:stage, 'dev'}

  apim: false

plugins:
  - serverless-azure-functions

package:
  artifact: bin/Release/net8.0/publish/LocktonOrion.Functions.zip

functions:
  ScrapingTriggerFunction:
    handler: LocktonOrion.Functions.ScrapingTriggerFunction
    events:
      - serviceBus:
          name: message
          topicName: quotation-requests
          subscriptionName: scraping-service
          connection: AzureServiceBus__ConnectionString
          dataType: binary

  QuotationExpirationFunction:
    handler: LocktonOrion.Functions.QuotationExpirationFunction
    events:
      - timer:
          schedule: '0 0 2 * * *'
          runOnStartup: false
